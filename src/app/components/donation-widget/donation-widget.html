<div>
  <button (click)="expanded.set(!expanded())"
          class="flex w-full items-center gap-2 rounded-xl bg-gradient-to-r from-primary-600/20 to-accent-600/20
                 border border-primary-500/20 px-3 py-2.5 text-left text-sm font-medium text-gray-300
                 transition-all hover:border-primary-500/40 hover:text-white">
    <svg class="h-4 w-4 text-primary-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/>
    </svg>
    Support with Crypto
    <svg class="ml-auto h-4 w-4 transition-transform" [class.rotate-180]="expanded()" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
    </svg>
  </button>

  @if (expanded()) {
    <div class="mt-2 space-y-1.5 animate-fade-in">
      @for (addr of addresses; track addr.symbol) {
        <div class="flex items-center gap-2 rounded-lg bg-white/[0.03] px-3 py-2">
          <span class="shrink-0 rounded-md px-1.5 py-0.5 text-[10px] font-bold"
                [style.color]="addr.color"
                [style.background]="addr.color + '20'">
            {{ addr.symbol }}
          </span>
          <span class="min-w-0 flex-1 truncate font-mono text-[11px] text-gray-500">
            {{ addr.address }}
          </span>
          <df-copy-button [text]="addr.address" [label]="addr.coin" />
        </div>
      }
    </div>
  }
</div>
