<!-- Mobile overlay -->
@if (isOpen()) {
  <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm lg:hidden"
       (click)="closeSidebar.emit()"></div>
}

<aside
  class="fixed left-0 top-0 z-50 flex h-full w-72 flex-col border-r border-white/5
         bg-gray-950/95 backdrop-blur-xl transition-transform duration-300 lg:static lg:translate-x-0"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()">

  <!-- Logo -->
  <div class="flex h-16 items-center gap-3 border-b border-white/5 px-6">
    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-primary-500 to-accent-500">
      <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085"/>
      </svg>
    </div>
    <span class="bg-gradient-to-r from-primary-400 to-accent-400 bg-clip-text text-lg font-bold text-transparent">
      DevForge
    </span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto p-4">
    <!-- Home link -->
    <a routerLink="/" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{exact: true}"
       (click)="closeSidebar.emit()"
       class="mb-4 flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-400
              transition-all duration-200 hover:bg-white/5 hover:text-white">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
      </svg>
      All Tools
    </a>

    @for (cat of categories; track cat.id) {
      <div class="mb-4">
        <p class="mb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-gray-500">
          {{ cat.label }}
        </p>
        @for (tool of cat.tools; track tool.id) {
          <a [routerLink]="tool.route" routerLinkActive="bg-white/10 text-white"
             (click)="closeSidebar.emit()"
             class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-gray-400
                    transition-all duration-200 hover:bg-white/5 hover:text-white">
            <span class="flex h-5 w-5 items-center justify-center [&>svg]:h-4 [&>svg]:w-4"
                  [innerHTML]="tool.icon | safeHtml"></span>
            {{ tool.name }}
          </a>
        }
      </div>
    }
  </nav>

  <!-- Donation Widget -->
  <div class="border-t border-white/5 p-4">
    <df-donation-widget />
  </div>
</aside>
