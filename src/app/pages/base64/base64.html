<df-tool-layout title="Base64 Encoder / Decoder" description="Encode text to Base64 or decode Base64 back to text. Supports Unicode.">

  <!-- Mode Toggle -->
  <div class="flex gap-2">
    <button (click)="setMode('encode')"
            class="rounded-lg px-4 py-2 text-sm font-medium transition-all"
            [class]="mode() === 'encode' ? 'bg-primary-500 text-white' : 'bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white'">
      Encode
    </button>
    <button (click)="setMode('decode')"
            class="rounded-lg px-4 py-2 text-sm font-medium transition-all"
            [class]="mode() === 'decode' ? 'bg-primary-500 text-white' : 'bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white'">
      Decode
    </button>
    <button (click)="swap()" title="Swap input/output"
            class="ml-auto rounded-lg bg-white/5 px-3 py-2 text-sm text-gray-400 transition hover:bg-white/10 hover:text-white">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/>
      </svg>
    </button>
  </div>

  <!-- Input / Output -->
  <div class="grid gap-4 md:grid-cols-2">
    <div>
      <label class="mb-2 block text-sm font-medium text-gray-400">
        {{ mode() === 'encode' ? 'Text' : 'Base64' }}
      </label>
      <textarea
        [ngModel]="input()"
        (ngModelChange)="input.set($event)"
        class="w-full rounded-xl border border-white/10 bg-gray-900/80 p-4 font-mono text-sm text-gray-200 outline-none focus:border-primary-500/50 resize-y min-h-[200px]"
        [placeholder]="mode() === 'encode' ? 'Enter text to encode...' : 'Enter Base64 to decode...'">
      </textarea>
    </div>

    <div>
      <div class="mb-2 flex items-center justify-between">
        <label class="text-sm font-medium text-gray-400">
          {{ mode() === 'encode' ? 'Base64' : 'Text' }}
        </label>
        @if (output()) {
          <df-copy-button [text]="output()" label="result" />
        }
      </div>
      <pre class="min-h-[200px] whitespace-pre-wrap break-all rounded-xl border border-white/10 bg-gray-900/50 p-4 font-mono text-sm text-gray-300">{{ output() || 'Result will appear here...' }}</pre>
    </div>
  </div>

  @if (error()) {
    <div class="rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400">
      {{ error() }}
    </div>
  }
</df-tool-layout>
