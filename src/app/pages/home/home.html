<div class="mx-auto max-w-5xl animate-fade-in">
  <!-- Hero -->
  <div class="mb-10 text-center">
    <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-primary-500/20 bg-primary-500/10 px-4 py-1.5 text-xs font-medium text-primary-400">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 0 0-2.455 2.456Z"/>
      </svg>
      Free &amp; Open Source
    </div>
    <h1 class="bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-4xl font-extrabold text-transparent md:text-5xl">
      Developer Tools
    </h1>
    <p class="mx-auto mt-4 max-w-lg text-gray-400">
      Fast, beautiful, client-side tools for developers.
      No tracking, no ads, no server — everything runs in your browser.
    </p>
  </div>

  <!-- Tools Grid -->
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (tool of tools; track tool.id) {
      <a [routerLink]="tool.route"
         class="group relative flex flex-col gap-3 rounded-2xl border border-white/5 bg-white/[0.03] p-6
                backdrop-blur-sm transition-all duration-300 hover:-translate-y-1
                hover:border-primary-500/30 hover:bg-white/[0.06]
                hover:shadow-[0_0_30px_rgba(99,102,241,0.15)]">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-500/10 text-primary-400
                    transition-colors group-hover:bg-primary-500/20 [&>svg]:h-5 [&>svg]:w-5"
             [innerHTML]="tool.icon | safeHtml"></div>
        <div>
          <h3 class="font-semibold text-white">{{ tool.name }}</h3>
          <p class="mt-1 text-sm text-gray-400">{{ tool.description }}</p>
        </div>
        <svg class="absolute right-4 top-4 h-4 w-4 text-gray-600 transition-all group-hover:translate-x-1 group-hover:text-primary-400"
             fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
        </svg>
      </a>
    }
  </div>
</div>
